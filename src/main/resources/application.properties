spring.application.name=ai-voting-system

# Server Configuration
server.port=${PORT:8080}

# MongoDB Configuration (.env file se lega)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-key-that-is-at-least-256-bits-long-for-HS256-algorithm-security}
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# Groq API Configuration (.env file se lega)
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# Logging Configuration
logging.level.root=INFO
logging.level.com.nihal.aivotingsystem=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Mail Configuration (.env file se lega)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OpenRouter Configuration (.env file se lega)
openrouter.api.key=${OPENROUTER_API_KEY}